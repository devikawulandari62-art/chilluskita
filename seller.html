<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Penjual & Keuangan - CHILLUS!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { green: '#99220F', darkgreen: '#2C1A12', gold: '#F2A900' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <header class="bg-brand-darkgreen text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center text-brand-darkgreen font-black text-xl shadow">CH</div>
        <div>
          <h1 class="text-lg font-black leading-none">Dashboard Keuangan & Penjual</h1>
          <span class="text-xs text-amber-300">CHILLUS! Enterprise Control Center</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" target="_blank" class="text-xs bg-red-700 hover:bg-red-800 text-white px-3 py-1.5 rounded-lg font-bold">
          <i class="fa-solid fa-external-link-alt mr-1"></i> Web Pembeli
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- STATISTIK KEUANGAN & LABA RUGI -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Total Pendapatan</div>
        <div id="statRevenue" class="text-2xl font-black text-gray-800">Rp 0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Estimasi Laba Bersih (Profit)</div>
        <div id="statProfit" class="text-2xl font-black text-emerald-600">Rp 0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Pesanan Pending</div>
        <div id="statPending" class="text-2xl font-black text-amber-500">0</div>
      </div>
      <div class="bg-white p-5 rounded-2xl border shadow-sm">
        <div class="text-xs font-bold text-gray-400 uppercase">Pesanan Selesai</div>
        <div id="statCompleted" class="text-2xl font-black text-blue-600">0</div>
      </div>
    </div>

    <!-- TAB NAVIGASI -->
    <div class="flex border-b border-gray-200 justify-between items-center">
      <div class="flex">
        <button onclick="switchTab('orders')" id="tabOrdersBtn" class="px-6 py-3 font-bold text-sm border-b-2 border-brand-green text-brand-green">
          <i class="fa-solid fa-list-check mr-1"></i> Pesanan Masuk
        </button>
        <button onclick="switchTab('products')" id="tabProductsBtn" class="px-6 py-3 font-bold text-sm text-gray-500 hover:text-gray-700">
          <i class="fa-solid fa-boxes-stacked mr-1"></i> Kelola & Harga Produk
        </button>
      </div>
      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">
        <i class="fa-solid fa-file-excel mr-1"></i> Download Laporan Excel (CSV)
      </button>
    </div>

    <!-- TAB 1: PESANAN -->
    <section id="tabOrders" class="space-y-4">
      <div class="bg-white rounded-2xl border shadow-sm overflow-hidden p-4">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="bg-gray-100 text-gray-600 uppercase font-bold border-b">
                <th class="p-3">ID / Tanggal</th>
                <th class="p-3">Pembeli</th>
                <th class="p-3">Produk</th>
                <th class="p-3">Total & Bayar</th>
                <th class="p-3">Maps</th>
                <th class="p-3">Bukti</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody" class="divide-y">
              <tr><td colspan="7" class="text-center py-8 text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 2: KELOLA PRODUK & MODAL -->
    <section id="tabProducts" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border shadow-sm p-6 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-gray-800 text-base">Atur Harga Jual, Harga Modal (HPP), & Stok</h2>
          <div class="flex gap-2">
            <button onclick="addNewProduct()" class="bg-amber-500 text-brand-darkgreen font-bold px-3 py-2 rounded-xl text-xs shadow"><i class="fa-solid fa-plus mr-1"></i> Tambah Produk</button>
            <button onclick="saveProductsToCloud()" class="bg-brand-green text-white font-bold px-4 py-2 rounded-xl text-xs shadow"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Simpan ke Cloud</button>
          </div>
        </div>
        <div id="sellerProductList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

  </main>

  <script>
    const BIN_ID = '6abce08fffd5d160533e94a5';
    const API_KEY = '$2a$10$5wo.GwuohqUiBjnvbtjxgOUc.Dabg/e.Ey864jBQBuN1LeQC4fT7m';

    let cloudDataOrders = [];
    let cloudDataProducts = [];

    async function loadCloudData() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
        const data = await res.json();
        cloudDataOrders = data.record.orders || [];
        cloudDataProducts = data.record.products || [];
        renderOrders();
        renderSellerProducts();
      } catch (err) { alert('Gagal mengambil data cloud.'); }
    }

    function switchTab(tab) {
      if (tab === 'orders') {
        document.getElementById('tabOrders').classList.remove('hidden');
        document.getElementById('tabProducts').classList.add('hidden');
        document.getElementById('tabOrdersBtn').className = 'px-6 py-3 font-bold text-sm border-b-2 border-brand-green text-brand-green';
        document.getElementById('tabProductsBtn').className = 'px-6 py-3 font-bold text-sm text-gray-500';
      } else {
        document.getElementById('tabOrders').classList.add('hidden');
        document.getElementById('tabProducts').classList.remove('hidden');
        document.getElementById('tabProductsBtn').className = 'px-6 py-3 font-bold text-sm border-b-2 border-brand-green text-brand-green';
        document.getElementById('tabOrdersBtn').className = 'px-6 py-3 font-bold text-sm text-gray-500';
      }
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = '';
      let rev = 0, profit = 0, pending = 0, completed = 0;

      if (cloudDataOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-400">Belum ada pesanan.</td></tr>`;
      } else {
        cloudDataOrders.forEach((o, idx) => {
          rev += o.totalPrice;
          if (o.status === 'Selesai') {
            completed++;
            o.items.forEach(item => {
              const prodRef = cloudDataProducts.find(p => p.id === item.id);
              const modal = prodRef && prodRef.costPrice ? prodRef.costPrice : (item.price * 0.6);
              profit += (item.price - modal) * item.qty;
            });
          } else { pending++; }

          const itemsText = o.items.map(i => `${i.name} (x${i.qty})`).join('<br>');
          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="p-3"><div class="font-bold">${o.id}</div><div class="text-[10px] text-gray-400">${o.date}</div></td>
              <td class="p-3"><div class="font-bold">${o.custName}</div><div class="text-gray-600"><i class="fa-brands fa-whatsapp text-emerald-600"></i> ${o.custWA}</div></td>
              <td class="p-3">${itemsText}</td>
              <td class="p-3"><div class="font-bold">Rp ${o.totalPrice.toLocaleString('id-ID')}</div><span class="text-[10px] px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-800">${o.payMethod}</span></td>
              <td class="p-3"><a href="${o.custMaps}" target="_blank" class="text-blue-600 underline font-bold">Maps</a></td>
              <td class="p-3">${o.proofImg ? `<a href="${o.proofImg}" target="_blank" class="text-red-600 font-bold">Bukti</a>` : 'Cash'}</td>
              <td class="p-3"><button onclick="toggleStatus(${idx})" class="px-2 py-1 rounded text-[10px] font-bold ${o.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${o.status}</button></td>
            </tr>
          `;
        });
      }
      document.getElementById('statRevenue').innerText = `Rp ${rev.toLocaleString('id-ID')}`;
      document.getElementById('statProfit').innerText = `Rp ${Math.round(profit).toLocaleString('id-ID')}`;
      document.getElementById('statPending').innerText = pending;
      document.getElementById('statCompleted').innerText = completed;
    }

    async function toggleStatus(idx) {
      cloudDataOrders[idx].status = cloudDataOrders[idx].status === 'Selesai' ? 'Menunggu Konfirmasi' : 'Selesai';
      await updateCloudDatabase();
      renderOrders();
    }

    function renderSellerProducts() {
      const container = document.getElementById('sellerProductList');
      container.innerHTML = '';
      cloudDataProducts.forEach((p, idx) => {
        container.innerHTML += `
          <div class="p-4 border rounded-xl bg-gray-50 space-y-2 relative">
            <button onclick="deleteProd(${idx})" class="absolute top-3 right-3 text-red-500 font-bold bg-white p-1 rounded border text-xs"><i class="fa-solid fa-trash"></i></button>
            <div class="flex items-center gap-3 pr-8">
              <img src="${p.img}" class="w-12 h-12 object-cover rounded border">
              <div class="flex-1">
                <label class="block text-[10px] font-bold text-gray-500">Nama Produk</label>
                <input type="text" value="${p.name}" onchange="cloudDataProducts[${idx}].name = this.value" class="w-full text-sm font-bold border rounded p-1">
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-gray-500">Jual (Rp)</label>
                <input type="number" value="${p.price}" onchange="cloudDataProducts[${idx}].price = Number(this.value)" class="w-full text-xs font-bold border rounded p-1">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-gray-500">Modal/HPP (Rp)</label>
                <input type="number" value="${p.costPrice || 3500}" onchange="cloudDataProducts[${idx}].costPrice = Number(this.value)" class="w-full text-xs font-bold border rounded p-1">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-gray-500">Stok</label>
                <input type="number" value="${p.stock}" onchange="cloudDataProducts[${idx}].stock = Number(this.value)" class="w-full text-xs font-bold border rounded p-1">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-gray-500">Label Badge & Foto URL</label>
              <input type="text" value="${p.badge || ''}" onchange="cloudDataProducts[${idx}].badge = this.value" class="w-full text-xs border rounded p-1 mb-1">
              <input type="text" value="${p.img}" onchange="cloudDataProducts[${idx}].img = this.value" class="w-full text-xs border rounded p-1">
            </div>
          </div>
        `;
      });
    }

    function addNewProduct() {
      const newId = cloudDataProducts.length > 0 ? Math.max(...cloudDataProducts.map(p => p.id)) + 1 : 1;
      cloudDataProducts.push({ id: newId, name: "Produk Baru", price: 6000, costPrice: 3500, stock: 30, badge: "Regular 6k", img: "https://images.unsplash.com/photo-1599598425947-3300262b7036?auto=format&fit=crop&w=500&q=80" });
      renderSellerProducts();
    }

    function deleteProd(idx) {
      if(confirm('Hapus produk ini?')) { cloudDataProducts.splice(idx,1); renderSellerProducts(); }
    }

    async function saveProductsToCloud() {
      await updateCloudDatabase();
      alert('✅ Berhasil disimpan ke cloud!');
    }

    async function updateCloudDatabase() {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
          body: JSON.stringify({ orders: cloudDataOrders, products: cloudDataProducts })
        });
      } catch(err) { alert('Gagal sinkronisasi cloud.'); }
    }

    function exportToExcel() {
      let csv = 'ID Pesanan,Tanggal,Nama Pembeli,No WA,Total Harga,Metode Bayar,Status\n';
      cloudDataOrders.forEach(o => {
        csv += `"${o.id}","${o.date}","${o.custName}","${o.custWA}","${o.totalPrice}","${o.payMethod}","${o.status}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Laporan_Keuangan_CHILLUS_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    document.addEventListener('DOMContentLoaded', loadCloudData);
  </script>
</body>
</html>
